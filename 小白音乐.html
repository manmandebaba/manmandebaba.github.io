<script>
// ============================================================
// 工具函数
// ============================================================

function decodeHTML(html) {
  if (!html) return '';
  const txt = document.createElement('textarea');
  txt.innerHTML = html;
  return txt.value;
}

function formatTime(seconds) {
  if (isNaN(seconds)) return '00:00';
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function artworkShort2Long(albumpicShort) {
  if (!albumpicShort) return undefined;
  const idx = albumpicShort.indexOf('/');
  return idx !== -1
    ? `https://img4.kuwo.cn/star/albumcover/1080${albumpicShort.slice(idx)}`
    : undefined;
}

function getDefaultCover() {
  const canvas = document.createElement('canvas');
  canvas.width = 160;
  canvas.height = 160;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 160, 160);
  grad.addColorStop(0, '#8b5cf6');
  grad.addColorStop(1, '#6d28d9');
  ctx.fillStyle = grad;
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(0, 0, 160, 160, 24);
    ctx.fill();
  } else {
    ctx.fillRect(0, 0, 160, 160);
  }
  ctx.fillStyle = 'white';
  ctx.font = '70px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🎵', 80, 82);
  return canvas.toDataURL('image/png');
}

const DEFAULT_COVER = getDefaultCover();

function safeRead(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function safeWrite(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function getProxyUrl(url) {
  const proxyBase = localStorage.getItem('music_cors_proxy') || 'https://seep.eu.org/';
  const cleanProxy = proxyBase.endsWith('/') ? proxyBase : proxyBase + '/';
  return `${cleanProxy}${url}`;
}

function sanitizeFileName(name) {
  return String(name || 'file').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
}

const LS_RESUME = 'music_resume_v2';
const LS_MODE = 'music_play_mode_v2';
const LS_DEFAULT_QUALITY = 'music_default_quality_v2';

let currentQuery = '';
let currentPage = 1;
let playlist = [];
let currentIndex = -1;
let lyrics = [];
let lastActiveIdx = -1;
let lastResumeSave = 0;

let playMode = localStorage.getItem(LS_MODE) || 'list'; // list / one / random

// ============================================================
// 主题
// ============================================================

function setTheme(isDark) {
  const html = document.documentElement;

  if (isDark) {
    html.classList.add('dark');
    html.classList.remove('light');
    sunPath.classList.remove('hidden');
    moonPath.classList.add('hidden');
  } else {
    html.classList.remove('dark');
    html.classList.add('light');
    sunPath.classList.add('hidden');
    moonPath.classList.remove('hidden');
  }

  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function toggleTheme() {
  const isDark = document.documentElement.classList.contains('dark');
  setTheme(!isDark);
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  setTheme(saved !== 'light');
}

// ============================================================
// 本地数据
// ============================================================

function getFavorites() {
  return safeRead(LS_FAV, []);
}

function saveFavorites(list) {
  safeWrite(LS_FAV, list);
  updateFavSummary();
}

function isFavorite(id) {
  return getFavorites().some(x => String(x.id) === String(id));
}

function toggleFavorite(song) {
  if (!song) return;

  let list = getFavorites();
  const exists = list.some(x => String(x.id) === String(song.id));

  if (exists) {
    list = list.filter(x => String(x.id) !== String(song.id));
    toastMini('已取消收藏');
  } else {
    list.unshift(song);
    toastMini('已加入收藏');
  }

  saveFavorites(list);
  renderPlaylist();
  updateFavButton();
}

function updateFavSummary() {
  const list = getFavorites();
  favSummary.innerText = list.length ? `已收藏 ${list.length} 首歌曲` : '暂无收藏';
}

function addRecent(song) {
  if (!song) return;

  let list = safeRead(LS_RECENT, []);
  list = list.filter(x => String(x.id) !== String(song.id));
  list.unshift(song);
  list = list.slice(0, 20);
  safeWrite(LS_RECENT, list);
}

function addSearchHistory(keyword) {
  if (!keyword) return;

  let list = safeRead(LS_SEARCH, []);
  list = list.filter(x => x !== keyword);
  list.unshift(keyword);
  list = list.slice(0, 10);
  safeWrite(LS_SEARCH, list);
  renderSearchHistory();
}

function renderSearchHistory() {
  const list = safeRead(LS_SEARCH, []);

  if (!list.length) {
    searchHistoryBox.innerHTML = '<span class="text-[11px] text-slate-500">暂无历史</span>';
    return;
  }

  searchHistoryBox.innerHTML = list.map(k => `
    <button class="history-chip text-[11px] px-2 py-1 rounded-full bg-slate-800 text-slate-300 hover:bg-brand-600 hover:text-white" data-key="${k}">
      ${k}
    </button>
  `).join('');
}

function renderHotKeywords() {
  const words = ['周杰伦', '林俊杰', '邓紫棋', '许嵩', '五月天', '薛之谦', '陈奕迅', '王力宏', '孙燕姿', '张杰'];
  hotKeywords.innerHTML = words.map(k => `
    <button class="hot-chip text-[11px] px-2 py-1 rounded-full bg-brand-600/20 text-brand-400 hover:bg-brand-600 hover:text-white" data-key="${k}">
      ${k}
    </button>
  `).join('');
}

function saveResume() {
  if (currentIndex === -1 || !playlist[currentIndex]) return;
  if (!audioPlayer.duration) return;

  const now = Date.now();
  if (now - lastResumeSave < 3000) return;
  lastResumeSave = now;

  safeWrite(LS_RESUME, {
    song: playlist[currentIndex],
    time: audioPlayer.currentTime || 0,
    quality: qualitySelect.value,
    ts: now
  });
}

function tryLoadResume() {
  const data = safeRead(LS_RESUME, null);
  if (!data || !data.song) return;
  miniLyricText.innerText = `上次播放：${data.song.title} - ${data.song.artist}`;
}

function initVolume() {
  const v = Number(localStorage.getItem(LS_VOLUME) || 80);
  volumeSlider.value = v;
  audioPlayer.volume = v / 100;
}

function setVolume(v) {
  audioPlayer.volume = Number(v) / 100;
  localStorage.setItem(LS_VOLUME, String(v));
}

// ============================================================
// 播放模式
// ============================================================

function updatePlayModeButton() {
  const map = {
    list: '🔁 列表',
    one: '🔂 单曲',
    random: '🔀 随机'
  };

  playModeBtn.innerText = map[playMode] || '🔁 列表';
}

function togglePlayMode() {
  if (playMode === 'list') playMode = 'one';
  else if (playMode === 'one') playMode = 'random';
  else playMode = 'list';

  localStorage.setItem(LS_MODE, playMode);
  updatePlayModeButton();
}

function getNextIndex() {
  if (!playlist.length) return -1;

  if (playMode === 'one') return currentIndex;

  if (playMode === 'random') {
    if (playlist.length === 1) return 0;
    let n;
    do {
      n = Math.floor(Math.random() * playlist.length);
    } while (n === currentIndex);
    return n;
  }

  return currentIndex < playlist.length - 1 ? currentIndex + 1 : 0;
}

// ============================================================
// API
// ============================================================

async function searchMusic(query, page) {
  const url =
    `http://search.kuwo.cn/r.s?client=kt&all=${encodeURIComponent(query)}&pn=${page - 1}&rn=30&uid=2574109560&ver=kwplayer_ar_8.5.4.2&vipver=1&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1`;

  const response = await fetch(getProxyUrl(url));
  let text = await response.text();

  if (text.startsWith('callback(') || text.startsWith('jsonp(')) {
    text = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
  }

  let res;

  try {
    res = JSON.parse(text);
  } catch (e) {
    res = eval('(' + text + ')');
  }

  const list = res.abslist || [];

  const songs = list.map(_ => ({
    id: String(_.MUSICRID || '').replace('MUSIC_', ''),
    artwork: artworkShort2Long(_.web_albumpic_short),
    title: decodeHTML(_.NAME || ''),
    artist: decodeHTML(_.ARTIST || ''),
    album: decodeHTML(_.ALBUM || '')
  })).filter(x => x.id && x.title);

  const isEnd = (+res.PN + 1) * +res.RN >= +res.TOTAL;

  return { isEnd, data: songs };
}

async function fetchLyrics(songId) {
  const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;

  try {
    const response = await fetch(getProxyUrl(url));
    const res = await response.json();
    const rawList = res.data?.lrclist || [];

    return rawList.map(line => {
      let time = 0;

      if (typeof line.time === 'string' && line.time.includes(':')) {
        const parts = line.time.split(':');
        if (parts.length === 2) {
          time = parseInt(parts[0]) * 60 + parseFloat(parts[1]);
        }
      } else {
        time = parseFloat(line.time) || 0;
      }

      return {
        time,
        text: decodeHTML(line.lineLyric || '')
      };
    }).filter(item => item.text);
  } catch (e) {
    console.error('歌词加载失败:', e);
    return [];
  }
}

async function fetchHighResArtwork(songId) {
  const url = `http://m.kuwo.cn/newh5/singles/songinfoandlrc?musicId=${songId}&httpStatus=1`;

  try {
    const response = await fetch(getProxyUrl(url));
    const res = await response.json();
    const originalUrl = res.data?.songinfo?.pic;

    if (originalUrl) {
      const secureUrl = originalUrl.replace(/^http:/i, 'https:');

      if (secureUrl.includes('starheads/')) {
        return secureUrl.replace(/starheads\/\d+/, 'starheads/800');
      }

      if (secureUrl.includes('albumcover/')) {
        return secureUrl.replace(/albumcover\/\d+/, 'albumcover/800');
      }

      return secureUrl;
    }

    return null;
  } catch {
    return null;
  }
}

// ============================================================
// 渲染
// ============================================================

async function triggerSearch() {
  const query = searchInput.value.trim();
  if (!query) return;

  currentQuery = query;
  currentPage = 1;
  addSearchHistory(query);
  await loadSearchList();
}

async function loadSearchList() {
  musicList.innerHTML = '<div class="text-center text-slate-400 py-12 text-xs">🔍 正在搜寻...</div>';

  try {
    const result = await searchMusic(currentQuery, currentPage);
    playlist = result.data;
    currentIndex = -1;

    if (!playlist.length) {
      musicList.innerHTML = '<div class="text-center text-slate-500 py-12 text-xs">没有找到相关音乐 😭</div>';
      pagination.classList.add('hidden');
      return;
    }

    renderPlaylist();
    pageIndicator.innerText = `第 ${currentPage} 页`;
    pagination.classList.remove('hidden');

    prevPageBtn.disabled = currentPage === 1;
    prevPageBtn.className = currentPage === 1
      ? 'text-[11px] px-2.5 py-1 bg-slate-800 text-slate-600 rounded-lg cursor-not-allowed'
      : 'text-[11px] px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition';

  } catch (err) {
    musicList.innerHTML = '<div class="text-center text-red-400 py-8 px-4 text-xs">加载失败，请检查代理设置</div>';
    console.error(err);
  }
}

function renderPlaylist() {
  musicList.innerHTML = playlist.map((song, idx) => {
    const isActive = currentIndex === idx;
    const fav = isFavorite(song.id);

    return `
      <div data-index="${idx}" class="flex items-center justify-between p-2.5 cursor-pointer transition ${isActive ? 'bg-brand-600/15 border-l-4 border-brand-500' : 'hover:bg-slate-800/40'}">
        <div class="flex items-center space-x-2.5 min-w-0 flex-1">
          <div class="w-6 text-center text-[10px] ${isActive ? 'text-brand-400' : 'text-slate-500'}">${idx + 1}</div>
          <img src="${song.artwork || DEFAULT_COVER}" class="w-9 h-9 rounded-lg object-cover bg-slate-800 shrink-0" onerror="this.src='${DEFAULT_COVER}'">
          <div class="min-w-0 flex-1">
            <p class="text-xs font-semibold truncate ${isActive ? 'text-brand-400' : 'text-slate-100'}">${song.title}</p>
            <p class="text-[10px] text-slate-400 truncate">${song.artist} · ${song.album || '未知专辑'}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0 ml-2">
          <button data-fav="${idx}" class="fav-btn text-sm ${fav ? 'text-pink-400' : 'text-slate-500'} hover:text-pink-400">${fav ? '♥' : '♡'}</button>
          <span class="text-[10px] text-slate-500">播放</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderLyrics() {
  if (!lyrics || !lyrics.length) {
    lyricsContainer.innerHTML = '<div class="text-center text-slate-600 py-4 text-xs">暂无歌词</div>';
    return;
  }

  lyricsContainer.innerHTML = lyrics.map((line, idx) => `
    <div id="lyric-line-${idx}" data-time="${line.time}" class="lyric-line py-0.5 px-1.5 text-center text-xs md:text-sm text-slate-500 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded">
      ${line.text}
    </div>
  `).join('');
}

function setCoverBackground(url) {
  const cover = url || DEFAULT_COVER;
  coverBg.style.backgroundImage = `url("${cover}")`;
}

function toastMini(text) {
  miniLyricText.innerText = text;

  setTimeout(() => {
    if (currentIndex !== -1 && playlist[currentIndex]) {
      miniLyricText.innerText = `🎵 ${playlist[currentIndex].title} - ${playlist[currentIndex].artist}`;
    }
  }, 1200);
}

function updateFavButton() {
  if (currentIndex === -1 || !playlist[currentIndex]) {
    favCurrentBtn.innerText = '♡ 收藏';
    favCurrentBtn.classList.remove('text-pink-400');
    return;
  }

  const song = playlist[currentIndex];
  const fav = isFavorite(song.id);

  favCurrentBtn.innerText = fav ? '♥ 已藏' : '♡ 收藏';
  favCurrentBtn.classList.toggle('text-pink-400', fav);
}

function showFavoritesAsList() {
  const list = getFavorites();

  if (!list.length) {
    musicList.innerHTML = '<div class="text-center text-slate-500 py-12 text-xs">还没有收藏歌曲</div>';
    return;
  }

  playlist = list;
  currentIndex = -1;
  renderPlaylist();
  pageIndicator.innerText = '我的收藏';
  pagination.classList.add('hidden');
}

// ============================================================
// 播放
// ============================================================

function buildPlayUrl(song) {
  const QUALITY_MAP = {
    '128k': 'standard',
    '320k': 'exhigh',
    'flac': 'lossless'
  };

  const apiLevel = QUALITY_MAP[qualitySelect.value] || 'standard';

  return `https://music.nxinxz.com/kw.php?id=${encodeURIComponent(song.id)}&level=${apiLevel}&type=mp3`;
}

async function playSong(idx, resumeTime = 0) {
  if (idx < 0 || idx >= playlist.length) return;

  currentIndex = idx;
  const song = playlist[currentIndex];

  addRecent(song);
  renderPlaylist();
  updateFavButton();

  playerTitle.innerText = song.title;
  playerArtist.innerText = song.artist;
  playerCover.src = song.artwork || DEFAULT_COVER;
  playerCover.onerror = function() { this.src = DEFAULT_COVER; };

  setCoverBackground(song.artwork || DEFAULT_COVER);

  const playUrl = buildPlayUrl(song);
  audioPlayer.src = playUrl;

  try {
    await audioPlayer.play();
    updatePlayButtonState(true);
    if (resumeTime > 0) {
      audioPlayer.currentTime = resumeTime;
    }
  } catch (err) {
    console.log('等待用户交互或播放失败:', err);
  }

  fetchHighResArtwork(song.id).then(url => {
    if (url) {
      song.artwork = url;
      playerCover.src = url;
      setCoverBackground(url);
      updateFavButton();
    }
  });

  lastActiveIdx = -1;
  miniLyricText.innerText = '⏳ 正在加载歌词...';
  lyricsContainer.innerHTML = '<div class="text-center text-slate-500 py-4 text-xs">正在加载...</div>';
  downloadLrcBtn.classList.add('hidden');
  lyrics = [];

  const rawLyrics = await fetchLyrics(song.id);

  if (rawLyrics && rawLyrics.length > 0) {
    lyrics = rawLyrics;
    renderLyrics();
    downloadLrcBtn.classList.remove('hidden');
    miniLyricText.innerText = `🎵 ${song.title} - ${song.artist}`;
  } else {
    lyricsContainer.innerHTML = '<div class="text-center text-slate-600 py-4 text-xs">暂无歌词</div>';
    miniLyricText.innerText = '🔇 暂无歌词';
  }
}

function updatePlayButtonState(isPlaying) {
  if (isPlaying) {
    playIcon.innerHTML = `
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
    `;
  } else {
    playIcon.innerHTML = `
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
    `;
  }
}

// ============================================================
// 下载 LRC
// ============================================================

function downloadLyrics() {
  if (!lyrics.length || currentIndex === -1) {
    alert('没有歌词可下载');
    return;
  }

  const song = playlist[currentIndex];

  let lrc = `[ti:${song.title}]\n[ar:${song.artist}]\n[al:${song.album || '未知'}]\n`;

  lyrics.forEach(line => {
    const m = Math.floor(line.time / 60).toString().padStart(2, '0');
    const s = Math.floor(line.time % 60).toString().padStart(2, '0');
    const ms = Math.floor((line.time % 1) * 100).toString().padStart(2, '0');
    lrc += `[${m}:${s}.${ms}]${line.text}\n`;
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lrc], { type: 'text/plain;charset=utf-8' }));
  a.download = `${sanitizeFileName(song.title)} - ${sanitizeFileName(song.artist)}.lrc`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============================================================
// 音频事件
// ============================================================

audioPlayer.ontimeupdate = () => {
  const cur = audioPlayer.currentTime;
  const dur = audioPlayer.duration || 0;

  saveResume();

  progressBar.style.width = `${(cur / dur) * 100 || 0}%`;
  currentTimeEl.innerText = formatTime(cur);
  durationTimeEl.innerText = formatTime(dur);

  if (lyrics.length > 0) {
    let activeIdx = -1;

    for (let i = 0; i < lyrics.length; i++) {
      if (cur >= lyrics[i].time) activeIdx = i;
      else break;
    }

    if (activeIdx === -1) activeIdx = 0;

    if (activeIdx !== lastActiveIdx) {
      lastActiveIdx = activeIdx;
      const line = lyrics[activeIdx];

      miniLyricText.innerText = line.text ? `🎤 ${line.text}` : '🎵 ...';

      document.querySelectorAll('.lyric-line').forEach((el, idx) => {
        if (idx === activeIdx) {
          el.className = 'lyric-line py-1 px-1.5 text-center text-xs md:text-sm text-brand-400 font-extrabold transition-all duration-300 transform scale-105 animate-lyric';

          const containerHeight = lyricsContainer.clientHeight;
          const lineOffsetTop = el.offsetTop;
          const lineHeight = el.clientHeight;

          lyricsContainer.scrollTo({
            top: lineOffsetTop - containerHeight / 2 + lineHeight / 2,
            behavior: 'smooth'
          });
        } else {
          el.className = 'lyric-line py-0.5 px-1.5 text-center text-xs md:text-sm text-slate-500 font-medium transition-all duration-200 cursor-pointer hover:text-white rounded';
        }
      });
    }
  }
};

audioPlayer.onended = () => {
  const next = getNextIndex();
  if (next !== -1) playSong(next);
};

audioPlayer.onplay = () => updatePlayButtonState(true);
audioPlayer.onpause = () => updatePlayButtonState(false);

// ============================================================
// 事件绑定
// ============================================================

themeToggle.onclick = toggleTheme;

searchBtn.onclick = triggerSearch;

searchInput.onkeypress = e => {
  if (e.key === 'Enter') triggerSearch();
};

musicList.addEventListener('click', e => {
  const favBtn = e.target.closest('[data-fav]');

  if (favBtn) {
    e.stopPropagation();
    const idx = parseInt(favBtn.dataset.fav, 10);
    toggleFavorite(playlist[idx]);
    return;
  }

  const row = e.target.closest('[data-index]');
  if (row) {
    playSong(parseInt(row.dataset.index, 10));
  }
});

prevPageBtn.onclick = async () => {
  if (currentPage > 1) {
    currentPage--;
    await loadSearchList();
  }
};

nextPageBtn.onclick = async () => {
  currentPage++;
  await loadSearchList();
};

playBtn.onclick = () => {
  if (!audioPlayer.src) return;

  if (audioPlayer.paused) {
    audioPlayer.play();
    updatePlayButtonState(true);
  } else {
    audioPlayer.pause();
    updatePlayButtonState(false);
  }
};

prevBtn.onclick = () => {
  if (!playlist.length) return;
  const idx = currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
  playSong(idx);
};

nextBtn.onclick = () => {
  if (!playlist.length) return;
  const next = getNextIndex();
  if (next !== -1) playSong(next);
};

progressContainer.onclick = e => {
  if (!audioPlayer.duration) return;

  const rect = progressContainer.getBoundingClientRect();
  audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
};

lyricsContainer.onclick = e => {
  const line = e.target.closest('.lyric-line');
  if (!line) return;

  const t = parseFloat(line.dataset.time);
  if (!isNaN(t)) audioPlayer.currentTime = t;
};

qualitySelect.onchange = () => {
  localStorage.setItem(LS_DEFAULT_QUALITY, qualitySelect.value);

  if (currentIndex !== -1) {
    const t = audioPlayer.currentTime;
    playSong(currentIndex, t);
  }
};

downloadLrcBtn.onclick = downloadLyrics;

playModeBtn.onclick = togglePlayMode;

favCurrentBtn.onclick = () => {
  if (currentIndex === -1) {
    alert('请先播放一首歌曲');
    return;
  }
  toggleFavorite(playlist[currentIndex]);
};

volumeSlider.oninput = e => {
  setVolume(e.target.value);
};

showFavBtn.onclick = showFavoritesAsList;

clearHistoryBtn.onclick = () => {
  localStorage.removeItem(LS_SEARCH);
  renderSearchHistory();
};

hotKeywords.addEventListener('click', e => {
  const btn = e.target.closest('[data-key]');
  if (!btn) return;
  searchInput.value = btn.dataset.key;
  triggerSearch();
});

searchHistoryBox.addEventListener('click', e => {
  const btn = e.target.closest('[data-key]');
  if (!btn) return;
  searchInput.value = btn.dataset.key;
  triggerSearch();
});

// 设置弹窗
settingsBtn.onclick = () => {
  proxyInput.value = localStorage.getItem('music_cors_proxy') || 'https://seep.eu.org/';
  defaultQualitySelect.value = localStorage.getItem(LS_DEFAULT_QUALITY) || qualitySelect.value || '128k';
  settingsModal.classList.remove('hidden');
};

closeSettingsBtn.onclick = () => {
  settingsModal.classList.add('hidden');
};

saveSettingsBtn.onclick = () => {
  const proxy = proxyInput.value.trim();

  if (proxy) localStorage.setItem('music_cors_proxy', proxy);
  else localStorage.removeItem('music_cors_proxy');

  localStorage.setItem(LS_DEFAULT_QUALITY, defaultQualitySelect.value);
  qualitySelect.value = defaultQualitySelect.value;

  settingsModal.classList.add('hidden');
  toastMini('设置已保存');
};

clearAllDataBtn.onclick = () => {
  if (!confirm('确认清空收藏、历史、断点和设置吗？')) return;

  [
    LS_FAV,
    LS_RECENT,
    LS_SEARCH,
    LS_VOLUME,
    LS_RESUME,
    LS_MODE,
    LS_DEFAULT_QUALITY,
    'music_cors_proxy'
  ].forEach(k => localStorage.removeItem(k));

  location.reload();
};

// ============================================================
// 初始化
// ============================================================

function initDefaultQuality() {
  const q = localStorage.getItem(LS_DEFAULT_QUALITY) || '128k';
  qualitySelect.value = q;
}

function initApp() {
  initTheme();
  initDefaultQuality();
  initVolume();
  renderHotKeywords();
  renderSearchHistory();
  updateFavSummary();
  updatePlayModeButton();
  tryLoadResume();

  playerCover.src = DEFAULT_COVER;
  playerCover.onerror = function() { this.src = DEFAULT_COVER; };
  setCoverBackground(DEFAULT_COVER);

  console.log('🎵 小白音乐网 作者QQ:3452068530已加载');
}

initApp();
</script>
